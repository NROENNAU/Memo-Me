name: Web-Version auf GitHub Pages veröffentlichen

# Läuft bei jedem Push auf diesen Branch und baut die Web-Version der App neu,
# damit sie unter der öffentlichen GitHub-Pages-URL testbar ist.
on:
  push:
    branches:
      - claude/memo-me-expo-setup-lvty67
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Version bauen
        run: npx expo export --platform web

      - name: 404-Seite anlegen (Absicherung gegen Seiten-Refresh)
        run: cp dist/index.html dist/404.html

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build-Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
