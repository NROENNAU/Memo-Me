plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.facerecognition'
version = '0.1.0'

android {
  namespace "expo.modules.facerecognition"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.google.mlkit:face-detection:16.1.7'
}
